[package]
name = "lab3"
version = "0.1.0"
edition = "2021"

[lib]
name = "lab3"
path = "src/lib.rs"

[[bin]]
name = "lab3_demo"
path = "src/main.rs"

[[bench]]
name = "bench"
harness = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
